syntax = "proto3";

package omote;

// Command types for button presses
enum OmoteCommandType {
  OMOTE_COMMAND_TYPE_UNSPECIFIED = 0;
  SHORT = 1;
  LONG = 2;
}

// Remote control commands
// These map to physical buttons and actions on the OMOTE remote
enum OmoteCommand {
  OMOTE_COMMAND_UNSPECIFIED = 0;
  POWER_ON = 1;
  POWER_OFF = 2;
  DOWN = 3;
  UP = 4;
  RIGHT = 5;
  LEFT = 6;
  SELECT = 7;
  HOME = 8;
  MENU = 9;
  PLAY_PAUSE = 10;
  VOL_PLUS = 11;
  VOL_MINUS = 12;
  VOL_MUTE = 13;
  SKIP_BACKWARD = 14;
  SKIP_FORWARD = 15;

  // Generic device pairing commands
  PAIRING_START = 16;
  PAIRING_SUBMIT_PIN = 17;
  PAIRING_CANCEL = 18;

  // State synchronization
  SYNC_STATE = 19;

  // Additional commands to be mapped
  STOP = 20;
  REWIND = 21;
  FORWARD = 22;
  CONF = 23;
  INFO = 24;
  OK = 25;
  BACK = 26;
  SRC = 27;
  CHANNEL_UP = 28;
  REC = 29;
  CHANNEL_DOWN = 30;
  RED = 31;
  GREEN = 32;
  YELLOW = 33;
  BLUE = 34;
  GUI_EVENT = 35;

  // Device discovery and management (RemoteEvent.device carries the target id
  // where one applies)
  DEVICE_SCAN_START = 36;   // hub runs a network scan (e.g. pyatv.scan())
  DEVICE_SCAN_CANCEL = 37;  // abort an in-progress scan
  DEVICE_FORGET = 38;       // delete stored credentials for RemoteEvent.device
  LIST_DEVICES = 39;        // request paired devices from hub storage
}

// Event sent from OMOTE remote to hub
message RemoteEvent {
  // Device identifier (string for now, may migrate to uint32 device_id later)
  string device = 1;

  // Remote control command
  OmoteCommand command = 2;

  // Command type (short press, long press)
  OmoteCommandType type = 3;

  // Optional remote identifier
  string remote_id = 4;

  // MAC address of the remote (8 bytes for EUI-64)
  // Using fixed64 for consistent encoding
  fixed64 remote_mac = 5;

  // Optional additional data (escape hatch for custom payloads)
  // Limited to 32 bytes for ESP-NOW compatibility
  bytes data = 10;
}

// Response kind for command results
enum ResponseKind {
  RESPONSE_KIND_UNSPECIFIED = 0;
  ACK = 1;
  VOLUME = 2;
  POWER = 3;
  ERROR = 4;
  STATE_SYNC = 5;
  PAIRING = 6;
  NONE = 7;
  DEVICE_LIST = 8;
}

// Acknowledgment response (empty)
message Ack {
  // Empty message - presence indicates acknowledgment
}

// Volume level response
message Volume {
  // Volume level in dB (float for half-dB precision, e.g. -30.5)
  float level = 1;

  // Mute state
  bool is_muted = 2;
}

// Power state response
message Power {
  bool is_on = 1;
}

// Categorizes a device failure so the OMOTE can decide whether to surface it
// to the user or silently ignore it, without string-parsing the message.
// Mirrors google.rpc.Status / ucapi's IntegrationSetupError pattern.
enum ErrorCategory {
  // Unset/unknown. Additive default; older clients see this and the OMOTE
  // treats it as "surface" (fail-safe).
  ERROR_CATEGORY_UNSPECIFIED = 0;

  // Device unreachable: timeout, network failure, connection lost, or a
  // missing/garbled response. The OMOTE should surface this.
  DEVICE_UNAVAILABLE = 1;

  // Expected command-level rejection: unsupported command, invalid input, or
  // device-rejected. The OMOTE may safely ignore it (e.g. an unmapped button).
  COMMAND_REJECTED = 2;

  // Unexpected internal fault. The OMOTE should surface this.
  INTERNAL = 3;
}

// Error response
message Error {
  string message = 1;

  // Classifies the failure; see ErrorCategory. Additive and back-compatible:
  // older clients ignore it and treat every error as "surface".
  ErrorCategory category = 2;
}

// Closed set mirroring pyatv's MediaType; UNSPECIFIED is the additive default so
// unknown values and older clients degrade to "no media type", not a free string.
enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_VIDEO = 1;
  MEDIA_TYPE_MUSIC = 2;
  MEDIA_TYPE_TV = 3;
}

// Media metadata
message Metadata {
  string title = 1;
  string artist = 2;
  string album = 3;

  // Duration in seconds (0 if unknown)
  uint32 duration = 4;

  // Current position in seconds
  uint32 position = 5;

  // Playback state: "playing", "paused", "stopped", etc.
  string state = 6;

  MediaType media_type = 7;
}

// Media player state for devices with playback capabilities
message MediaPlayerState {
  Metadata playback = 1;
}

// Time synchronization data
message Time {
  // Unix epoch timestamp (using fixed64 for consistent encoding)
  fixed64 timestamp = 1;

  // Timezone offset in seconds (using sint32 for zigzag encoding of negative offsets)
  sint32 timezone_offset = 2;
}

// Device state for sync responses
message DeviceState {
  // Field 3 (Volume volume) was removed as never-populated: no hub driver
  // observes volume, so the field never carried data. Reserved against
  // accidental reuse with different semantics; delete the reservation if a
  // driver starts observing volume for state sync.
  reserved 3;

  string device_id = 1;
  bool is_on = 2;
  MediaPlayerState media_player = 4;
}

// State synchronization response
message StateSync {
  // Optional time data (NanoPB will generate has_time automatically)
  Time time = 1;

  // Per-device state snapshots
  repeated DeviceState devices = 2;
}

// Closed set of pairing-session steps mirroring the hub's PairingState. On hub
// decode, unset and unknown future values degrade to FAILED — a visible pairing
// failure rather than a silent no-step. The OMOTE firmware differs: it treats
// UNSPECIFIED and unknown values like IDLE, deactivating the session silently.
enum PairingStep {
  PAIRING_STEP_UNSPECIFIED = 0;
  PAIRING_STEP_IDLE = 1;
  PAIRING_STEP_AWAITING_PIN = 2;
  PAIRING_STEP_SUCCESS = 3;
  PAIRING_STEP_FAILED = 4;
  PAIRING_STEP_CANCELLED = 5;
}

// Pairing status response
message PairingStatus {
  // Device identifier
  string device_id = 1;

  PairingStep step = 2;

  // User-facing message (e.g., "Enter PIN shown on Apple TV")
  string message = 3;

  // Whether a PIN is required for this step
  bool requires_pin = 4;

  // Expected PIN length (0 if unknown or not applicable)
  uint32 expected_pin_length = 5;

  // Optional context token to track pairing session
  string context_token = 6;
}

// Closed set mirroring pyatv's PairingRequirement; UNSPECIFIED is the additive
// default so unset and unknown future values degrade to "unknown", letting the
// UI fall back to a non-pairable row instead of guessing.
enum PairingRequirement {
  PAIRING_REQUIREMENT_UNSPECIFIED = 0;
  PAIRING_REQUIREMENT_UNSUPPORTED = 1;
  PAIRING_REQUIREMENT_DISABLED = 2;
  PAIRING_REQUIREMENT_NOT_NEEDED = 3;
  PAIRING_REQUIREMENT_OPTIONAL = 4;
  PAIRING_REQUIREMENT_MANDATORY = 5;
}

// A discovered or stored device. The hub truncates every string field to its
// nanopb cap BEFORE encoding, so long real-world names/models/addresses can
// never fail a scan result at the encode step.
message DeviceInfo {
  // Stable unique identifier (e.g. pyatv's identifier)
  string device_id = 1;

  string name = 2;

  // IPv4 dotted-quad; the cap is sized for IPv4 only (intentional)
  string address = 3;

  // Model string for detail screens (e.g. "Apple TV 4K")
  string model = 4;

  PairingRequirement pairing = 5;

  // Whether the hub holds credentials for this device
  bool paired = 6;

  // Unix epoch of when pairing completed; 0 = unknown
  fixed64 paired_at = 7;
}

// Devices response: scan results (incremental or final) and stored-device
// listings share this shape.
message DeviceList {
  repeated DeviceInfo devices = 1;

  // True on the final result of a scan (distinguishes it from progress
  // updates); always true for LIST_DEVICES responses.
  bool scan_complete = 2;
}

// Command result sent from hub to OMOTE remote
message CommandResult {
  // Response type
  ResponseKind kind = 1;

  // Response data (only one will be set based on kind)
  oneof data {
    Ack ack = 10;
    Volume volume = 11;
    Power power = 12;
    Error error = 13;
    StateSync state_sync = 14;
    PairingStatus pairing = 15;
    DeviceList device_list = 16;
  }
}
