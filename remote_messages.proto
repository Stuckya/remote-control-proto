syntax = "proto3";

package omote;

// Command types for button presses
enum OmoteCommandType {
  OMOTE_COMMAND_TYPE_UNSPECIFIED = 0;
  SHORT = 1;
  LONG = 2;
}

// Remote control commands
// These map to physical buttons and actions on the OMOTE remote
enum OmoteCommand {
  OMOTE_COMMAND_UNSPECIFIED = 0;
  POWER_ON = 1;
  POWER_OFF = 2;
  DOWN = 3;
  UP = 4;
  RIGHT = 5;
  LEFT = 6;
  SELECT = 7;
  HOME = 8;
  MENU = 9;
  PLAY_PAUSE = 10;
  VOL_PLUS = 11;
  VOL_MINUS = 12;
  VOL_MUTE = 13;
  SKIP_BACKWARD = 14;
  SKIP_FORWARD = 15;

  // Generic device pairing commands
  PAIRING_START = 16;
  PAIRING_SUBMIT_PIN = 17;
  PAIRING_CANCEL = 18;

  // State synchronization
  SYNC_STATE = 19;

  // Additional commands to be mapped
  STOP = 20;
  REWIND = 21;
  FORWARD = 22;
  CONF = 23;
  INFO = 24;
  OK = 25;
  BACK = 26;
  SRC = 27;
  CHANNEL_UP = 28;
  REC = 29;
  CHANNEL_DOWN = 30;
  RED = 31;
  GREEN = 32;
  YELLOW = 33;
  BLUE = 34;
  GUI_EVENT = 35;
}

// Event sent from OMOTE remote to hub
message RemoteEvent {
  // Device identifier (string for now, may migrate to uint32 device_id later)
  string device = 1;

  // Remote control command
  OmoteCommand command = 2;

  // Command type (short press, long press)
  OmoteCommandType type = 3;

  // Optional remote identifier
  string remote_id = 4;

  // MAC address of the remote (8 bytes for EUI-64)
  // Using fixed64 for consistent encoding
  fixed64 remote_mac = 5;

  // Optional additional data (escape hatch for custom payloads)
  // Limited to 32 bytes for ESP-NOW compatibility
  bytes data = 10;
}

// Response kind for command results
enum ResponseKind {
  RESPONSE_KIND_UNSPECIFIED = 0;
  ACK = 1;
  VOLUME = 2;
  POWER = 3;
  ERROR = 4;
  STATE_SYNC = 5;
  PAIRING = 6;
  NONE = 7;
}

// Acknowledgment response (empty)
message Ack {
  // Empty message - presence indicates acknowledgment
}

// Volume level response
message Volume {
  // Volume level in dB (can be negative, using sint32 for zigzag encoding)
  // Examples: -23 dB, 0 dB, +12 dB
  sint32 level = 1;

  // Mute state
  bool is_muted = 2;
}

// Power state response
message Power {
  bool is_on = 1;
}

// Error response
message Error {
  string message = 1;
}

// Media metadata
message Metadata {
  string title = 1;
  string artist = 2;
  string album = 3;

  // Duration in seconds (0 if unknown)
  uint32 duration = 4;

  // Current position in seconds
  uint32 position = 5;

  // Playback state: "playing", "paused", "stopped", etc.
  string state = 6;
}

// Media player state for devices with playback capabilities
message MediaPlayerState {
  Metadata playback = 1;
}

// Time synchronization data
message Time {
  // Unix epoch timestamp (using fixed64 for consistent encoding)
  fixed64 timestamp = 1;

  // Timezone offset in seconds (using sint32 for zigzag encoding of negative offsets)
  sint32 timezone_offset = 2;
}

// Device state for sync responses
message DeviceState {
  string device_id = 1;
  bool is_on = 2;
  Volume volume = 3;
  MediaPlayerState media_player = 4;
}

// State synchronization response
message StateSync {
  // Optional time data (NanoPB will generate has_time automatically)
  Time time = 1;

  // Per-device state snapshots
  repeated DeviceState devices = 2;
}

// Pairing status response
message PairingStatus {
  // Device identifier
  string device_id = 1;

  // Pairing step: "started", "awaiting_pin", "success", "failed", "cancelled"
  string step = 2;

  // User-facing message (e.g., "Enter PIN shown on Apple TV")
  string message = 3;

  // Whether a PIN is required for this step
  bool requires_pin = 4;

  // Expected PIN length (0 if unknown or not applicable)
  uint32 expected_pin_length = 5;

  // Optional context token to track pairing session
  string context_token = 6;
}

// Command result sent from hub to OMOTE remote
message CommandResult {
  // Response type
  ResponseKind kind = 1;

  // Response data (only one will be set based on kind)
  oneof data {
    Ack ack = 10;
    Volume volume = 11;
    Power power = 12;
    Error error = 13;
    StateSync state_sync = 14;
    PairingStatus pairing = 15;
  }
}
