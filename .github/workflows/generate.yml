name: Schema

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install local codegen plugins (hash-pinned)
        run: pip install --require-hashes -r requirements-codegen.txt

      # Lint, format, and breaking-change checks against the PR base; never
      # pushes to the BSR.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.75.0" # buf
          push: false
          archive: false

      # Generated code is committed; it must match what the pinned toolchain
      # produces from the schema in this revision.
      - name: Generate and verify committed code
        run: |
          buf generate
          git diff --exit-code -- src/omote generated
