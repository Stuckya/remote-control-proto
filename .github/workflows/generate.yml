name: Schema

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install local codegen plugins (hash-pinned)
        run: pip install --require-hashes -r requirements-codegen.txt

      # Lint, format, and breaking-change checks against the PR base; never
      # pushes to the BSR.
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: "1.72.0" # buf
          push: false
          archive: false

      # Generated code is committed; it must match what the pinned toolchain
      # produces from the schema in this revision.
      - name: Generate and verify committed code
        run: |
          buf generate
          git diff --exit-code -- src/omote generated
